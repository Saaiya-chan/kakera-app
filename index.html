<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>名画ジグソー(試作)</title>
<style>
  /* 美術館の展示室:藍の壁、金の額縁、和紙のマット */
  :root{
    --wall:#1e2b40;      /* ベロ藍の壁 */
    --wall-2:#26364f;    /* 壁の明るい部分 */
    --washi:#ece4d3;     /* 和紙(マット・ラベル) */
    --sumi:#2a2520;      /* 墨(和紙の上の文字) */
    --gold:#b9975b;      /* 金箔 */
    --gold-dk:#7d6136;   /* 額縁の影 */
    --mist:#a7b2c4;      /* 壁の上の控えめな文字 */
    --serif:"Iowan Old Style","Palatino","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    --piece-r:3px;
    --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,select,textarea{-webkit-user-select:auto;user-select:auto}
  html,body{margin:0;height:100%;color:var(--washi);font-family:var(--sans);overscroll-behavior:none;
    background:radial-gradient(120% 80% at 50% 30%, var(--wall-2), var(--wall) 70%) fixed var(--wall);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
    padding:calc(14px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  header .logo{flex:1}
  .stage-word{display:none}
  .ctl.gear-l{display:none}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
  .sheet .own{align-self:flex-start;color:#6d6458}
  .sheet .theme-switch{border-color:#b9ad98}
  .sheet .theme-switch button{color:#6d6458}
  .sheet .theme-switch button[aria-pressed="true"]{background:var(--wall);color:var(--washi)}
  .logo{font-family:var(--serif);font-size:20px;letter-spacing:.08em;color:var(--washi)}
  .logo small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.02em;color:var(--mist);margin-top:2px}
  .stage{font-family:var(--serif);color:var(--mist);font-size:14px}
  .stage b{font-weight:400;font-size:26px;color:var(--gold);margin-right:2px}

  /* 額縁:金の縁+和紙のマット。この画面で一番目立たせる部分 */
  .board-wrap{position:relative;margin:0 auto;padding:10px;border-radius:3px;background:var(--washi);
    box-shadow:
      0 0 0 1px var(--gold-dk),
      0 0 0 7px var(--gold),
      0 0 0 8px var(--gold-dk),
      inset 0 0 0 1px rgba(125,97,54,.25),
      0 18px 40px rgba(0,0,0,.45)}
  #board{position:relative;width:100%;touch-action:none}
  .piece{position:absolute;transition:left .22s ease, top .22s ease}
  .piece.dragging{will-change:transform}
  .piece.dragging{transition:none;z-index:50;filter:brightness(1.06) drop-shadow(0 6px 10px rgba(0,0,0,.25))}
  .face{position:absolute;display:block;transition:top .15s,left .15s,border-radius .15s}
  .piece.snap .face{animation:snap .4s ease}
  @keyframes snap{0%{filter:none}40%{filter:brightness(1.25) sepia(.25)}100%{filter:none}}
  .piece.hint .face{outline:3px solid var(--gold);outline-offset:-3px;animation:blink .5s ease 3}
  .cellhint{position:absolute;border:2px dashed var(--gold-dk);border-radius:3px;pointer-events:none;animation:blink .5s ease 3;z-index:40}
  @keyframes blink{50%{opacity:.25}}
  .peek{position:absolute;top:10px;left:10px;width:calc(100% - 20px);height:calc(100% - 20px);opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
  .peek.on{opacity:1}

  /* 作品ラベル(美術館の壁の解説ラベル風) */
  .dock{display:flex;flex-direction:column;gap:18px}
  .dock-body{display:flex;flex-direction:column;gap:18px}
  .caption{align-self:center;min-width:62%;max-width:100%;background:var(--washi);color:var(--sumi);
    padding:10px 14px 11px;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.3);text-align:left}
  .cap-title{font-family:var(--serif);font-size:20px;line-height:1.4;text-align:center}
  .cap-meta{display:none}

  /* 道具:線で描いたアイコン+小さな文字 */
  .tools{display:flex;justify-content:center;gap:28px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--washi);font-size:11.5px;min-width:64px}
  .tool .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
    border:1px solid rgba(185,151,91,.65);background:rgba(255,255,255,.03);transition:background .15s}
  .tool:active .ic{background:rgba(185,151,91,.22)}
  .tool svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .own{font-size:12px;color:var(--mist);text-decoration:underline;text-underline-offset:3px;padding:6px 0}
  .dock-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .theme-switch{display:inline-flex;border-radius:999px;padding:3px;gap:2px;border:1px solid rgba(185,151,91,.5)}
  .theme-switch button{font-size:12px;padding:6px 12px;border-radius:999px;color:var(--mist)}
  .theme-switch button[aria-pressed="true"]{background:var(--gold);color:var(--wall)}
  .dock-btn{display:none}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ctl-group{display:flex;gap:10px}
  .ctl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:rgba(236,228,211,.10);color:var(--washi);border:1px solid rgba(236,228,211,.18)}
  .ctl:active{background:rgba(236,228,211,.22)}
  .ctl svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .exit-full{display:none}
  /* 全画面表示:額縁(絵)だけを残す */
  html.immersive header, html.immersive .dock, html.immersive .dock-btn{display:none!important}
  html.immersive .app{display:flex;align-items:center;justify-content:center;max-width:none;height:100%;min-height:0;
    padding:calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left))}
  html.immersive .board-wrap{padding:0;background:transparent;box-shadow:none}
  html.immersive .peek{top:0;left:0;width:100%;height:100%}
  html.immersive .exit-full{display:grid;place-items:center;position:fixed;z-index:90;width:40px;height:40px;border-radius:50%;
    right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(30,43,64,.75);color:var(--washi);border:1px solid rgba(236,228,211,.3)}
  .exit-full svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* シート(完成・ヒント・自分の絵) */
  .overlay{position:fixed;inset:0;background:rgba(14,20,31,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
  .overlay.on{display:flex}
  .sheet{background:var(--washi);color:var(--sumi);border-radius:4px;width:100%;max-width:380px;padding:22px;
    display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .sheet h2{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.06em;text-align:center}
  .done-img{display:block;width:100%;height:auto;border:6px solid #fff;box-shadow:0 0 0 1px var(--gold),0 8px 20px rgba(0,0,0,.2)}
  .artist{text-align:left}
  .artist .by{font-size:12px;color:#6d6458}
  .artist .name{font-family:var(--serif);font-size:19px;line-height:1.4;margin:2px 0}
  .artist a{display:inline-block;margin-top:8px;color:var(--wall);font-size:13px;text-decoration:underline;text-underline-offset:3px}
  .plays{font-size:11.5px;color:#8a8073}
  .set-links{display:flex;justify-content:center;gap:18px;font-size:12px}
  .set-links a{color:inherit;opacity:.75}
  html.no-ads #doneOv .adslot{display:none}
  .adslot{border:1px dashed #b9ad98;border-radius:3px;padding:12px;text-align:center;font-size:11.5px;color:#8a8073}
  .btn{font-size:15px;border-radius:999px;padding:13px 14px;background:var(--wall);color:var(--washi);letter-spacing:.02em;white-space:nowrap}
  .btn.ghost{background:none;color:var(--sumi);box-shadow:inset 0 0 0 1px #b9ad98}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5}
  label{font-size:13px;display:flex;flex-direction:column;gap:5px}
  input[type=text],input[type=url],select{font-family:inherit;font-size:15px;padding:10px;border:1px solid #c9bea9;border-radius:3px;background:#fbf8f1;color:var(--sumi)}
  input[type=file]{font-size:13px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .err{color:#a1352b;font-size:12px;min-height:1em}
  .note{font-size:11.5px;color:#8a8073;line-height:1.6}

  /* 横向き:額縁を画面いっぱいに。メニューは右下のボタンで下から出す */
  @media (orientation: landscape){
    .app{max-width:none;display:block;min-height:0;height:100%;
      padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
    header{display:none}
    .dock{position:fixed;left:50%;bottom:0;width:min(560px,calc(100vw - 24px));z-index:80;
      background:rgba(30,43,64,.96);border-top:1px solid rgba(185,151,91,.5);border-radius:14px 14px 0 0;
      box-shadow:0 -10px 30px rgba(0,0,0,.4);padding:16px 18px calc(12px + env(safe-area-inset-bottom));
      transform:translate(-50%,110%);transition:transform .25s ease}
    .dock.open{transform:translate(-50%,0)}
    .dock-body{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
    .caption{align-self:auto;min-width:0;flex:1 1 200px}
    .tools{gap:18px}
    .controls{flex:1 1 300px}
    .ctl.gear-l{display:grid}
    .dock-btn{display:grid;place-items:center;position:fixed;z-index:90;right:calc(14px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));
      width:46px;height:46px;border-radius:50%;background:var(--wall);border:1px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.4)}
    .dock-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round}
    .overlay{padding:10px}
    #doneOv .sheet{max-width:min(780px,96vw);max-height:calc(100vh - 20px);display:grid;
      grid-template-columns:auto minmax(220px,1fr);column-gap:22px;row-gap:12px;align-items:center}
    #doneOv .sheet > *{grid-column:2}
    #doneOv .done-img{grid-column:1;grid-row:1 / span 7;width:auto;height:auto;max-width:50vw;max-height:calc(100vh - 64px)}
  }
  /* ===== シンプルテーマ(案A):白い画面に絵を大きく。元のアプリに近い、すっきりした見た目 ===== */
  html[data-theme="simple"]{
    --wall:#f6f6f8; --wall-2:#f6f6f8; --washi:#ffffff; --sumi:#1d1d22; --gold:#1d1d22; --gold-dk:#1d1d22;
    --mist:#6b6b78; --blue:#2f6bff; --piece-r:4px;
    --serif:-apple-system,"Hiragino Sans",system-ui,sans-serif;
  }
  html[data-theme="simple"], html[data-theme="simple"] body{background:var(--wall);color:var(--sumi)}
  html[data-theme="simple"] .app{padding-left:12px;padding-right:12px;gap:14px}
  html[data-theme="simple"] header{display:grid;grid-template-columns:44px 1fr 44px}
  html[data-theme="simple"] header .logo{display:none}
  html[data-theme="simple"] header::before{content:""}
  html[data-theme="simple"] .stage{text-align:center;font-family:var(--sans);font-size:17px;font-weight:700;color:var(--sumi)}
  html[data-theme="simple"] .stage-word{display:inline;margin-right:4px}
  html[data-theme="simple"] .stage b{font-size:17px;font-weight:700;color:var(--sumi)}
  html[data-theme="simple"] #stageTotal{display:none}
  html[data-theme="simple"] .board-wrap{padding:0;background:transparent;border-radius:8px;box-shadow:none;overflow:hidden}
  html[data-theme="simple"] .peek{top:0;left:0;width:100%;height:100%}
  html[data-theme="simple"] .piece.hint .face{outline-color:var(--blue)}
  html[data-theme="simple"] .cellhint{border-color:var(--blue)}
  html[data-theme="simple"] .caption{background:none;box-shadow:none;padding:0;text-align:center;color:var(--mist)}
  html[data-theme="simple"] .cap-title{font-family:var(--sans);font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--sumi)}
  html[data-theme="simple"] .cap-meta{justify-content:center;color:var(--mist)}
  html[data-theme="simple"] .tool{color:var(--mist);font-size:11px}
  html[data-theme="simple"] .tool .ic{width:56px;height:56px;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  html[data-theme="simple"] .tool svg{stroke:var(--sumi);stroke-width:1.7}
  html[data-theme="simple"] #hintBtn .ic{background:var(--blue);box-shadow:0 4px 12px rgba(47,107,255,.35)}
  html[data-theme="simple"] #hintBtn svg{stroke:#fff}
  html[data-theme="simple"] .tool:active .ic{transform:scale(.96)}
  html[data-theme="simple"] .ctl{background:#fff;color:#6b6b78;border:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  html[data-theme="simple"] .ctl:active{background:#eceef3}
  html[data-theme="simple"] .exit-full{background:#fff;color:var(--sumi);border:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  html[data-theme="simple"] .overlay{background:rgba(20,20,30,.4)}
  html[data-theme="simple"] .sheet{background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  html[data-theme="simple"] .sheet h2{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:0}
  html[data-theme="simple"] .done-img{border:none;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  html[data-theme="simple"] .artist .name{font-family:var(--sans);font-weight:700;font-size:17px}
  html[data-theme="simple"] .artist .by, html[data-theme="simple"] .plays, html[data-theme="simple"] .sheet .own{color:var(--mist)}
  html[data-theme="simple"] .artist a{color:var(--blue)}
  html[data-theme="simple"] .btn{background:var(--blue);color:#fff;font-weight:600;letter-spacing:0}
  html[data-theme="simple"] .btn.ghost{background:#fff;color:var(--sumi);box-shadow:inset 0 0 0 1px #d5d7de}
  html[data-theme="simple"] .adslot{border-color:#d5d7de;color:var(--mist)}
  html[data-theme="simple"] .sheet .theme-switch{border-color:#d5d7de}
  html[data-theme="simple"] .sheet .theme-switch button{color:var(--mist)}
  html[data-theme="simple"] .sheet .theme-switch button[aria-pressed="true"]{background:var(--blue);color:#fff}
  html[data-theme="simple"] input[type=text],html[data-theme="simple"] input[type=url],html[data-theme="simple"] select{border:1px solid #d5d7de;border-radius:10px;background:#fff}
  @media (orientation: landscape){
    html[data-theme="simple"] .dock{background:rgba(255,255,255,.97);border-top:none;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
    html[data-theme="simple"] .dock-btn{background:#fff;border:none;box-shadow:0 2px 10px rgba(0,0,0,.15)}
    html[data-theme="simple"] .dock-btn svg{stroke:var(--sumi)}
  }
  /* ===== 完成の演出:盤面が光る → 光がはじけて、完成画面がふわっと開く ===== */
  /* 動かすのは拡大縮小と透明度だけ(iPhoneで滑らかに動く)。ぼかしは使わない */
  .board-wrap::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:70;opacity:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,250,232,.9), rgba(255,250,232,.35) 45%, rgba(255,250,232,0) 75%)}
  .board-wrap.complete{animation:boardPop .75s cubic-bezier(.2,.9,.3,1);will-change:transform}
  .board-wrap.complete::after{animation:flash .9s ease-out;will-change:opacity}
  @keyframes boardPop{0%{transform:scale(1)}35%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
  #doneOv.on{animation:ovIn .45s ease both}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}
  #doneOv .sheet{position:relative;z-index:2}
  #doneOv.on .sheet{animation:sheetBloom .7s cubic-bezier(.2,1.25,.4,1) .05s both;will-change:transform,opacity}
  @keyframes sheetBloom{0%{transform:translateY(16px) scale(.7);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
  #doneOv.on .done-img{animation:imgIn .8s ease .2s both;will-change:transform,opacity}
  @keyframes imgIn{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:none}}
  .burst{position:absolute;left:50%;top:50%;width:110vmax;height:110vmax;margin:-55vmax 0 0 -55vmax;will-change:transform,opacity;border-radius:50%;pointer-events:none;z-index:1;
    background:radial-gradient(circle, rgba(255,250,228,.95) 0%, rgba(255,226,150,.55) 14%, rgba(255,226,150,.15) 30%, rgba(255,226,150,0) 46%);
    animation:burst 1.3s cubic-bezier(.2,.8,.3,1) both}
  @keyframes burst{0%{transform:scale(.05);opacity:0}18%{opacity:1}100%{transform:scale(1);opacity:0}}
  .spark{position:absolute;left:50%;top:50%;width:var(--sz);height:var(--sz);margin:calc(var(--sz) / -2) 0 0 calc(var(--sz) / -2);border-radius:50%;
    background:var(--c);box-shadow:0 0 10px var(--c);pointer-events:none;z-index:3;opacity:0;
    animation:spark 1.25s cubic-bezier(.12,.75,.3,1) var(--d) forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
  /* 次のステージ:次の絵をちらっと見せるカード */
  .next-card{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 10px;border-radius:16px;text-align:left;
    background:var(--wall);color:var(--washi)}
  .next-card:active{transform:scale(.98)}
  .nx-thumb{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  .nx-thumb canvas{width:100%;height:100%;display:block;filter:blur(1.5px) saturate(1.1);transform:scale(1.08)}
  .nx-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .nx-text small{font-size:11.5px;opacity:.7}
  .nx-text b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nx-go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--gold);color:var(--wall)}
  .nx-go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #doneOv.on .nx-go{animation:nudge 1.6s ease-in-out 1.2s infinite}
  @keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(4px)}90%{transform:translateX(-1px)}}
  html[data-theme="simple"] .next-card{background:#fff;color:var(--sumi);box-shadow:inset 0 0 0 1px #e3e5ea, 0 6px 18px rgba(20,30,60,.08)}
  html[data-theme="simple"] .nx-thumb{box-shadow:none}
  html[data-theme="simple"] .nx-text small{color:var(--mist);opacity:1}
  html[data-theme="simple"] .nx-go{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.35)}
  @media (prefers-reduced-motion: reduce){ .burst,.spark{display:none} }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
  /* アイテム・BGM選択 */
  .tool .ic{position:relative}
  /* 道具が3つになったので、狭い画面では詰める */
  @media (max-width:430px){
    .controls{gap:4px}
    .ctl-group{gap:4px}
    .tool{min-width:54px}
    html[data-theme="simple"] .tool .ic{width:50px;height:50px}
  }
  .badge{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e8473b;color:#fff;font:700 11px/18px -apple-system,sans-serif;text-align:center;box-sizing:border-box}
  .badge.free{background:#2f9e5b}
  .tool.active .ic{outline:2px solid #2f6bff;outline-offset:2px}
  /* ===== 没入テーマ(案C):遊んでいる絵をぼかして背景に敷き、操作ボタンはすりガラス ===== */
  .bg-art,.bg-dim{display:none}
  html.glass{background:#0d0f16;color:#fff}
  html.glass body{background:transparent;color:#fff}
  html.glass .nx-text small{color:rgba(255,255,255,.75)}
  html.glass .bg-art{display:block;position:fixed;left:-8%;top:-8%;width:116%;height:116%;z-index:-2;filter:blur(18px) saturate(1.25);opacity:.85;transition:opacity .6s ease}
  html.glass .bg-dim{display:block;position:fixed;inset:0;z-index:-1;background:rgba(8,10,18,.4)}
  html.glass header{display:flex;align-items:center;gap:8px}
  html.glass .stage{height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;gap:2px;font-size:13px;color:#fff;margin-right:auto}
  html.glass .stage b{font-size:13px;color:#fff}
  html.glass .ctl{width:44px;height:44px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;box-shadow:none}
  html.glass .ctl:active{background:rgba(255,255,255,.26)}
  html.glass .board-wrap{border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.5)}
  html.glass .cap-title{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  html.glass .cap-meta{display:flex;justify-content:center;font-size:11px;color:rgba(255,255,255,.85);margin-top:2px}
  html.glass #capInfo{display:none}
  html.glass .tool{color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  html.glass .tool .ic{width:58px;height:58px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:none}
  html.glass .tool svg{stroke:#fff;stroke-width:1.8}
  html.glass .tool.active .ic{outline:2px solid #fff;outline-offset:2px}
  html.glass .badge{background:#3d6bff}
  html.glass .badge.free{background:#22a06b}
  html.glass .badge.ad{background:#ffc247;color:#2b1d00}
  html.glass .exit-full{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;box-shadow:none}
  html.glass .overlay{background:rgba(6,8,14,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  html.glass .sheet{background:rgba(24,26,36,.82);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  html.glass .artist .by, html.glass .plays, html.glass .sheet .own, html.glass .gal-meta small, html.glass .gal-empty{color:rgba(255,255,255,.72)}
  html.glass .done-img{box-shadow:0 10px 30px rgba(0,0,0,.45)}
  html.glass .btn{background:#fff;color:#11131a;font-weight:700}
  html.glass .btn.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff}
  html.glass .adslot{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.7)}
  html.glass .act{color:rgba(255,255,255,.8)}
  html.glass .act .ic{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:none}
  html.glass .act svg{stroke:#fff}
  html.glass .act.on .ic{background:#ff4f7b;border-color:#ff4f7b}
  html.glass #heartBtn.on svg{fill:#fff;stroke:#fff}
  html.glass #saveBtn.on .ic{background:#22a06b;border-color:#22a06b}
  html.glass #saveBtn.on svg{stroke:#fff}
  html.glass .next-card{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  html.glass .nx-go{background:#fff;color:#11131a}
  html.glass .sheet .theme-switch{border-color:rgba(255,255,255,.25)}
  html.glass .sheet .theme-switch button{color:rgba(255,255,255,.75)}
  html.glass .sheet .theme-switch button[aria-pressed="true"]{background:#fff;color:#11131a}
  html.glass .bgm-list button{border-color:rgba(255,255,255,.2)}
  html.glass .bgm-list button.sel{border-color:#fff}
  html.glass .gal-grid button{background:rgba(255,255,255,.08)}
  html.glass input[type=text],html.glass input[type=url],html.glass select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px}
  @media (orientation: landscape){
    html.glass .dock{background:rgba(14,16,24,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -8px 30px rgba(0,0,0,.35)}
    html.glass .dock-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
    html.glass .dock-btn svg{stroke:#fff}
  }
  /* 没入テーマの完成画面(縦向き):絵を画面いっぱいに出し、下に文字とボタンを重ねる */
  @media (orientation: portrait){
    html.glass #doneOv{padding:0;background:#0d0f16;-webkit-backdrop-filter:none;backdrop-filter:none}
    html.glass #doneOv .sheet{position:fixed;inset:0;max-width:none;max-height:none;width:auto;border-radius:0;border:none;background:transparent;box-shadow:none;
      display:flex;flex-direction:column;justify-content:flex-end;gap:12px;overflow:hidden;
      padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
    html.glass #doneOv.on .sheet{animation:ovIn .5s ease both}
    html.glass #doneOv .done-img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;object-fit:cover;border-radius:0;box-shadow:none;z-index:0}
    html.glass #doneOv .sheet::before{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;z-index:1;pointer-events:none;
      background:linear-gradient(to top, rgba(6,8,14,.96) 52%, rgba(6,8,14,0))}
    html.glass #doneOv .sheet > *:not(.done-img):not(h2){position:relative;z-index:2}
    html.glass #doneOv .sheet h2{z-index:2;width:auto;position:absolute;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
      height:34px;padding:0 16px;border-radius:17px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;font-size:13px;font-weight:700;color:#fff}
    html.glass #doneOv .artist{text-align:left}
    html.glass #doneOv .artist .name{font-size:28px;font-weight:700;line-height:1.3;color:#fff}
    html.glass #doneOv .artist .by{font-size:13px;color:rgba(255,255,255,.85)}
    html.glass #doneOv .done-actions{justify-content:flex-start;gap:10px;flex-wrap:wrap}
    html.glass #doneOv .act{flex-direction:row;gap:7px;height:46px;min-width:0;padding:0 16px;border-radius:23px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:13px;font-weight:700}
    html.glass #doneOv .act .ic{width:auto;height:auto;background:none;border:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
    html.glass #doneOv .act svg{width:18px;height:18px}
    html.glass #doneOv .act.on{background:#ff4f7b;border-color:#ff4f7b}
    html.glass #doneOv #saveBtn.on{background:#22a06b;border-color:#22a06b}
    html.glass #doneOv .act.on .ic{background:none}
    /* 応援したあとは、色の付いたハートだけにする(ボタンが伸びて2行にならないように) */
    html.glass #doneOv #heartBtn.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);padding:0;width:46px;justify-content:center}
    html.glass #doneOv #heartBtn.on svg{fill:#ff4f7b;stroke:#ff4f7b;width:22px;height:22px}
    #heartBtn.on #heartLbl, #saveBtn.on #saveLbl{display:none}
    html.glass #doneOv #saveBtn.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);padding:0;width:46px;justify-content:center}
    html.glass #doneOv #saveBtn.on svg{fill:#3ddc97;stroke:#3ddc97;width:22px;height:22px}
    html.glass #doneOv .plays, html.glass #doneOv .reward{font-size:12px;color:rgba(255,255,255,.8);margin:0}
    html.glass #doneOv .adslot{display:none}
    html.glass #doneOv .next-card{background:#fff;color:#11131a;box-shadow:none;border-radius:20px}
    html.glass #doneOv .nx-text small{color:#5c606b}
    html.glass #doneOv .nx-go{background:#11131a;color:#fff}
    /* 絵をタップ:文字やボタンを消して、絵の全体を見せる(もう一度タップで戻る) */
    html.glass #doneOv .done-img{transition:opacity .25s ease}
    html.glass #doneOv .sheet::before, html.glass #doneOv .sheet > *:not(.done-img){transition:opacity .25s ease}
    html.glass #doneOv{transition:background .45s ease}
    html.glass #doneOv.viewing{background:#000}
    html.glass #doneOv.viewing.leaving{background:transparent}
    html.glass #doneOv.viewing.leaving .sheet::before{opacity:1}
    html.glass #doneOv.viewing.leaving .sheet > *:not(.done-img){opacity:1}
    html.glass #doneOv .sheet::before, html.glass #doneOv .sheet > *:not(.done-img){transition:opacity .35s ease}
    html.glass #doneOv.viewing .done-img{object-fit:contain}
    html.glass #doneOv.viewing .sheet::before{opacity:0}
    html.glass #doneOv.viewing .sheet > *:not(.done-img){opacity:0;pointer-events:none}
    html.glass #doneOv .done-img{cursor:zoom-in}
    html.glass #doneOv.viewing .done-img{cursor:zoom-out}
  }
  /* アイテムを使ったときのエフェクト */
  .fx-pop{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 10px 34px rgba(0,0,0,.22);pointer-events:none;z-index:30;animation:fxPop 1s cubic-bezier(.2,.9,.3,1.15) forwards}
  .fx-pop svg{width:50px;height:50px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @keyframes fxPop{0%{transform:scale(.2) rotate(-12deg);opacity:0}22%{transform:scale(1.1) rotate(4deg);opacity:1}45%{transform:scale(1) rotate(0)}78%{transform:scale(1);opacity:1}100%{transform:scale(1.35);opacity:0}}
  .fx-ring{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:25;animation:fxRing 1.1s ease-out forwards}
  @keyframes fxRing{0%{box-shadow:inset 0 0 0 0 var(--fx),0 0 0 0 var(--fx)}30%{box-shadow:inset 0 0 0 5px var(--fx),0 0 28px 4px var(--fx)}100%{box-shadow:inset 0 0 0 0 transparent,0 0 0 0 transparent}}
  .fx-dot{position:fixed;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;z-index:1000}
  .tool.bump .ic{animation:bump .5s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
  .badge.pop{animation:badgePop .5s cubic-bezier(.2,.9,.3,1.6)}
  @keyframes badgePop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
  .piece.glint .face{animation:glint .9s ease}
  @keyframes glint{0%{filter:none}35%{filter:brightness(1.6) saturate(1.3)}100%{filter:none}}
  /* 縦向き:完成画面が画面に収まるよう、絵の高さをおさえ、はみ出したらスクロール */
  @media (orientation: portrait){
    #doneOv .sheet{max-height:calc(100dvh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch}
    #doneOv .done-img{width:auto;max-width:100%;max-height:38dvh;margin:0 auto}
    #doneOv .artist{text-align:center}
  }
  /* 完成画面の3つのボタン(応援・保存・作者) */
  .done-actions{display:flex;justify-content:center;gap:22px;margin:2px 0}
  .act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--mist,#777);min-width:60px}
  .act .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px #e3e5ea,0 3px 10px rgba(20,30,60,.08);position:relative}
  .act svg{width:22px;height:22px;fill:none;stroke:#1d1d22;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .act:active .ic{transform:scale(.94)}
  .act.on .ic{background:#fff0f3;box-shadow:inset 0 0 0 1px #ffc2cf}
  #heartBtn.on svg{fill:#ff3d6a;stroke:#ff3d6a}
  #saveBtn.on svg{stroke:#16a37a}
  .act.pulse .ic{animation:bump .5s cubic-bezier(.2,.9,.3,1.4)}
  .act[hidden]{display:none}
  /* コレクション */
  #homeOv{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(8,10,18,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));color:#fff}
  #homeOv.on{display:flex}
  .home{width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}
  .home-top{text-align:center}
  .home-top h1{margin:0;font-size:44px;font-weight:800;letter-spacing:.04em}
  .home-tag{margin:6px 0 0;font-size:14px;opacity:.8}
  .home-cont{display:flex;align-items:center;gap:16px;padding:14px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;text-align:left;width:100%}
  .home-cont canvas{width:84px;height:112px;border-radius:14px;object-fit:cover;flex:none;background:rgba(255,255,255,.1)}
  .home-cont-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
  .home-cont-txt small{font-size:12px;opacity:.75}
  .home-cont-txt b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .home-cont-txt em{font-style:normal;font-size:14px;font-weight:700;color:#ffd27a}
  .home-play{width:56px;height:56px;border-radius:28px;background:#fff;color:#11131a;display:grid;place-items:center;flex:none}
  .home-play svg{width:24px;height:24px;fill:currentColor}
  .home-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .home-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700}
  .home-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .home-btn i{position:absolute;top:8px;right:10px;font-style:normal;font-size:11px;opacity:.75}
  .art-list{display:flex;flex-direction:column;gap:8px;max-height:min(60vh,520px);overflow-y:auto;margin:6px 0 4px;-webkit-overflow-scrolling:touch}
  .art-list button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.08);color:inherit;text-align:left}
  .art-list .prof-av{width:40px;height:40px;font-size:16px}
  .art-list b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .art-list small{opacity:.7}
  .name-row{display:flex;align-items:center;justify-content:center;gap:10px}
  html.glass #doneOv .name-row{justify-content:flex-start}
  .sns-ic{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;padding:0}
  .sns-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sns-ic[hidden]{display:none}
  .prof .prof-head{display:flex;gap:14px;align-items:center;text-align:left}
  .prof .prof-head h2{margin:2px 0 0;text-align:left}
  .prof-av{width:56px;height:56px;border-radius:28px;background:#ff4f7b;color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
  .prof-bio{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap;text-align:left}
  .prof-bio:empty{display:none}
  .prof-sub{font-size:12px;opacity:.75;text-align:left;margin-top:4px}
  #doneArtist.tap{cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
  #doneArtist.tap::after{content:" ›";opacity:.7}
  .dbg-win{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:9999;min-height:32px;padding:0 10px;border-radius:16px;border:1px dashed #ff6b6b;background:rgba(40,0,0,.75);color:#ffb3b3;font-size:11px;font-weight:700}
  .gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:min(60vh,520px);overflow-y:auto;margin:6px 0 4px;-webkit-overflow-scrolling:touch}
  .gal-grid button{padding:0;border-radius:8px;overflow:hidden;background:#eef0f4;aspect-ratio:3/4}
  .gal-grid canvas{width:100%;height:100%;display:block;object-fit:cover}
  .gal-empty{font-size:13px;color:var(--mist,#777);text-align:center;padding:24px 8px;line-height:1.7}
  .gal-view canvas{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .gal-meta{text-align:center;line-height:1.5}
  .gal-meta b{display:block;font-size:17px}
  .gal-meta small{font-size:12px;color:var(--mist,#777)}
  .report-link{align-self:flex-start;font-size:12px;color:var(--mist,#888);text-decoration:underline;text-underline-offset:3px;padding:6px 0;min-height:32px}
  html.glass .report-link{color:rgba(255,255,255,.7)}
  .badge.ad{background:#f2a900;color:#231a00;letter-spacing:.02em}
  .tool.dim{opacity:.38}
  .easy-pill{display:none;margin:10px auto 0;padding:7px 16px;border-radius:999px;border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;font-size:13px}
  .easy-pill.on{display:block}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:rgba(20,20,20,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;line-height:1.5;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;max-width:86vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .reward{margin:6px 0 10px;font-size:13px;line-height:1.7}
  .bgm-list{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
  .bgm-list button{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid rgba(128,128,128,.3);background:transparent;color:inherit;font-size:14px}
  .bgm-list button.sel{border-color:#2f6bff;font-weight:700}
  .bgm-list button:disabled{opacity:.45}
  .bgm-list small{font-size:11px;opacity:.8;font-weight:400}
  .board-wrap.shake{animation:shake .28s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<canvas class="bg-art" id="bgArt" width="36" height="48" aria-hidden="true"></canvas><div class="bg-dim" aria-hidden="true"></div>
<div class="app">
  <header>
    <div class="logo"><span data-i18n="appName"></span><small data-i18n="subtitle"></small></div>
    <button class="ctl" id="homeBtn" data-i18n-label="homeBtn"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V20h-5v-5H9v5H4z"/></svg></button>
    <div class="stage" id="stageBox"><span class="stage-word" data-i18n="stageWord"></span><b id="stageNum">1</b><span id="stageTotal"></span></div>
    <button class="ctl gear" id="gearBtn" data-i18n-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <div class="board-wrap" id="wrap">
    <div id="board"></div>
    <canvas class="peek" id="peek"></canvas>
  </div>

     アプリ内の stages/manifest.json と、サーバーの manifest.json を読み込んで並べる。
     サーバーの一覧は前回分を保存しておき、オフラインでも同じ順で遊べるようにする。
     REMOTE_BASE が空のあいだは、アプリ内の一覧だけを使う。 */
  const REMOTE_BASE = 'https://kakera-az2.pages.dev';
  function fromManifest(list, base){
    return (list||[]).filter(st => st && st.id && st.file && !st.hidden).map(st => ({
      id: st.id,
      kind: st.kind==='artist' ? 'artist' : 'ai',
      title: typeof st.title==='object' ? (st.title[LANG] || st.title.en || st.title.ja || '') : (st.title||''),
      artist: st.artist || '',
      artist_id: st.artist_id || '',
      url: st.url || '',
      land: !!st.land,
      src: /^https?:|^data:/.test(st.file) ? st.file : base + st.file,
    }));
  }
  async function fetchJSON(url, ms){
    const ctl = window.AbortController ? new AbortController() : null;
    const tm = ctl && setTimeout(()=>ctl.abort(), ms);
    try{ const r = await fetch(url, {cache:'no-cache', signal: ctl && ctl.signal}); if(!r.ok) throw 0; return await r.json(); }
    finally{ if(tm) clearTimeout(tm); }
  }
  const imgDB = (()=>{
    let dbp=null;
    const open=()=> dbp || (dbp = new Promise((ok,ng)=>{ try{ const r=indexedDB.open('kakera-img',1); r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error); }catch(e){ ng(e); } }));
    const tx=(mode,fn)=> open().then(db=>new Promise((ok,ng)=>{ const t=db.transaction('img',mode); const st=t.objectStore('img'); const q=fn(st); t.oncomplete=()=>ok(q&&q.result); t.onerror=()=>ng(t.error); })).catch(()=>null);

      const el=document.createElement('div'); el.className='piece';
      const f=document.createElement('canvas'); f.className='face';
      el.appendChild(f); board.appendChild(el); els[p]=el;
      el.dataset.p=p; el.addEventListener('pointerdown', e=>onDown(e,p));
    }
    render(false);
  }

  let pieceR=3;
  function render(){
    const L=linkInfo(cellPiece);
    for(let cell=0;cell<N;cell++){
      const p=cellPiece[cell], el=els[p], f=el.firstChild;
      const r=Math.floor(cell/C), c=cell%C;
      el.style.left=(c*cw)+'px'; el.style.top=(r*ch)+'px'; el.style.width=cw+'px'; el.style.height=ch+'px';
      const hasR=L.right[cell], hasD=L.down[cell], hasL=c>0&&L.right[cell-1], hasU=r>0&&L.down[cell-C];
      // くっついている側は1pxずつ隣に重ねて、描画の端数で白いすき間が出ないようにする
      const OV=1, t=hasU?-OV:GAP, b=hasD?-OV:GAP, l=hasL?-OV:GAP, rr=hasR?-OV:GAP;
      f.style.top=t+'px'; f.style.left=l+'px';
      const rad=pieceR;
      f.style.borderRadius=`${(hasU||hasL)?0:rad}px ${(hasU||hasR)?0:rad}px ${(hasD||hasR)?0:rad}px ${(hasD||hasL)?0:rad}px`;
      drawFace(f,p,l,t,rr,b);
    }
    return L;
  }

  /* ---------- ドラッグ ---------- */
  let drag=null;
  function groupCellsOf(cell){
    const L=linkInfo(cellPiece), root=L.find(cell), cells=[];
    for(let i=0;i<N;i++) if(L.find(i)===root) cells.push(i);
    return cells;
  }
  // 動かす前につながっていたピース同士が、動かしたあとも隣り合っているか
  function breaksLinks(oldCp, newCp, before){
    const after=linkInfo(newCp), pos=[]; newCp.forEach((p,c)=>{ pos[p]=c; });
    for(let c=0;c<N;c++){
      const x=oldCp[c];
      if(before.right[c] && !after.right[pos[x]]) return true;
      if(before.down[c] && !after.down[pos[x]]) return true;
    }
    return false;
  }
  // ロック中の置き方:動かしたかたまりの行き先にあるかたまりは、形を保ったまま別の場所へ移す。
  // 移した先にまた別のかたまりがあれば、それも同じように移す(押し出しの連鎖)。
  // 置き方は小さな探索で決める(押し出す数が少なく、近い場所を優先)。見つからなければ null。
  function relocateGroups(cp, gCells, odr, odc, before){
    const off=odr*C+odc, T=gCells.map(c=>c+off);
    const owner=new Array(N), cellsOf=new Map();
    for(let c=0;c<N;c++){ const r=before.find(c); owner[c]=r; if(!cellsOf.has(r)) cellsOf.set(r,[]); cellsOf.get(r).push(c); }
    const gid=owner[gCells[0]];
    const fixed=new Set(T), free=new Set(), place=new Map();
    gCells.forEach(c=>{ owner[c]=-1; }); gCells.forEach(c=>{ if(!fixed.has(c)) free.add(c); });
    place.set(gid, T);
    const queue=[];
    const displace=(r)=>{ cellsOf.get(r).forEach(c=>{ owner[c]=-1; if(!fixed.has(c)) free.add(c); }); queue.push(r); };
    const hit=new Set(); T.forEach(c=>{ const r=owner[c]; if(r>=0 && !hit.has(r)){ hit.add(r); } });
    hit.forEach(r=>displace(r));
    let budget=4000;
    const shifts=[]; for(let dr=-R+1;dr<R;dr++) for(let dc=-C+1;dc<C;dc++) if(dr||dc) shifts.push([dr,dc]);
    function solve(){
      if(!queue.length) return true;
      if(--budget<0) return false;
      const r=queue.shift(), g=cellsOf.get(r), cands=[];
      for(const [dr,dc] of shifts){
        const cells=[], hits=new Set(); let ok=true;
        for(const c of g){ const rr=Math.floor(c/C)+dr, k=c%C+dc; if(rr<0||rr>=R||k<0||k>=C){ ok=false; break; } const n=rr*C+k; if(fixed.has(n)){ ok=false; break; } cells.push(n); if(owner[n]>=0) hits.add(owner[n]); }
        if(!ok) continue;
        const swap=(dr===-odr&&dc===-odc)?0:1;
        cands.push({cells, hits:[...hits], score: hits.size*100 + swap*10 + Math.abs(dr)+Math.abs(dc)});
      }
      cands.sort((a,b)=>a.score-b.score);
      for(const cd of cands){
        if(budget<0) break;
        // 置く
        cd.cells.forEach(n=>{ fixed.add(n); free.delete(n); }); place.set(r, cd.cells);
        const qLen=queue.length; cd.hits.forEach(h=>displace(h));
        if(solve()) return true;
        // 戻す
        queue.splice(qLen); cd.hits.forEach(h=>{ cellsOf.get(h).forEach(c=>{ owner[c]=h; free.delete(c); }); });
        cd.cells.forEach(n=>{ fixed.delete(n); if(owner[n]<0) free.add(n); }); place.delete(r);
      }
      queue.unshift(r);
      return false;
    }
    if(!solve()) return null;
    const np=cp.slice();
    place.forEach((cells, r)=>{ const src=(r===gid)?gCells:cellsOf.get(r); src.forEach((c,j)=>{ np[cells[j]]=cp[c]; }); });
    return np;
  }
  function onDown(e,p){
    if(busy || drag) return;
    e.preventDefault();
    const cell=cellPiece.indexOf(p);
    const cells=groupCellsOf(cell);
    drag={id:e.pointerId, sx:e.clientX, sy:e.clientY, cells, dx:0, dy:0};
    cells.forEach(c=>els[cellPiece[c]].classList.add('dragging'));
    try{ board.setPointerCapture(e.pointerId); }catch(_){}
  }
  board.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    drag.dx=e.clientX-drag.sx; drag.dy=e.clientY-drag.sy;
    drag.cells.forEach(c=>{ els[cellPiece[c]].style.transform=`translate(${drag.dx}px,${drag.dy}px)`; });
  });
  const end = e=>{
    if(!drag || e.pointerId!==drag.id) return;
    const d=drag; drag=null;
    const rows=d.cells.map(c=>Math.floor(c/C)), cols=d.cells.map(c=>c%C);
    let dr=Math.round(d.dy/ch), dc=Math.round(d.dx/cw);
    dr=Math.max(-Math.min(...rows), Math.min(R-1-Math.max(...rows), dr));
    dc=Math.max(-Math.min(...cols), Math.min(C-1-Math.max(...cols), dc));
    const moved=d.cells.map(c=>cellPiece[c]);
    const before=linkInfo(cellPiece);
    if(dr||dc){
      const off=dr*C+dc, G=new Set(d.cells), T=new Set(d.cells.map(c=>c+off));
      const np=cellPiece.slice();
      d.cells.forEach(c=>{ np[c+off]=cellPiece[c]; });
      T.forEach(t=>{ if(!G.has(t)){ let q=t; do{ q-=off; }while(T.has(q)); np[q]=cellPiece[t]; } });
      let use=np;
      if(lockActive && breaksLinks(cellPiece, np, before)){
        // ロック中:押し出されるかたまりを、形を保ったまま空いた場所へ移す
        use = relocateGroups(cellPiece, d.cells, dr, dc, before);
      }
      if(use){ cellPiece=use; moves++; if(moves===1) updateBadges(); }
      else {
        // どうしても形を保って置けないときだけ、取り消して元の位置へ戻す
        wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
        toast(t('lockBlocked')); vibrate([10,30,10]);
      }
    }
    // 掴んでいたカードを、指を離した位置から新しい位置へなめらかに
    moved.forEach(p=>{
      const el=els[p], cur=el.getBoundingClientRect();
      el.classList.remove('dragging'); el.style.transition='none'; el.style.transform='none';
    });
    const oldRects=moved.map(p=>({p, x:parseFloat(els[p].style.left)+d.dx, y:parseFloat(els[p].style.top)+d.dy}));
    const after=render();
    oldRects.forEach(({p,x,y})=>{
      const el=els[p]; const nx=parseFloat(el.style.left), ny=parseFloat(el.style.top);
      el.style.transform=`translate(${x-nx}px,${y-ny}px)`;
      el.getBoundingClientRect();
      el.style.transition='transform .2s ease'; el.style.transform='translate(0,0)';
      setTimeout(()=>{ el.style.transition=''; el.style.transform=''; },230);
    });
    if(after.count>before.count){
      // 新しくつながったカードを光らせる
      for(let cell=0;cell<N;cell++){
        const newly=(after.right[cell]&&!before.right[cell]) || (after.down[cell]&&!before.down[cell]);
        if(newly){ const a=els[cellPiece[cell]], b=els[cellPiece[after.right[cell]&&!before.right[cell]?cell+1:cell+C]];
          [a,b].forEach(el=>{ el.classList.remove('snap'); void el.offsetWidth; el.classList.add('snap'); }); }
      }
      vibrate(after.count-before.count>1 ? [15,40,15] : 15);
    }
    if(cellPiece.every((p,i)=>p===i)) win();
  };
  // iOSでは長押しすると標準のジェスチャー(選択メニュー)が始まり、ドラッグが中断される。
  // タッチの標準動作を止めて、ドラッグだけが届くようにする
  const stopTouch = e => { if(e.cancelable) e.preventDefault(); };
  board.addEventListener('touchstart', stopTouch, {passive:false});
  board.addEventListener('touchmove', stopTouch, {passive:false});
  document.getElementById('peekBtn').addEventListener('touchstart', stopTouch, {passive:false});

  board.addEventListener('pointerup', end);

    try{ const k='ejigsaw-plays-'+id; const n=(parseInt(localStorage.getItem(k)||'0',10)||0)+1; localStorage.setItem(k,String(n)); return n; }catch(_){ return null; }

  /* ---------- デバッグ用:すぐ完成させるボタン ----------

  /* ---------- サーバーへの数え上げ(完成・応援・保存)と報告 ---------- */

  const ICON_SOUND_ON='<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>', ICON_SOUND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  const bgm = (() => {
    // 静かなジャズ:エレピの和音(ⅱ–Ⅴ–Ⅰ)+ウッドベース+ブラシ+ときどきビブラフォン。すべてその場で音を作る

      {root:43, v:[65,69,71,76]},   // G13
      {root:48, v:[64,67,71,74]},   // Cmaj9
      {root:45, v:[61,67,70,72]},   // A7(b9)
      {root:50, v:[65,69,72,76]},   // Dm9
      {root:43, v:[65,69,71,76]},   // G13
      {root:52, v:[62,67,71,74]},   // Em7
      {root:45, v:[61,64,67,70]},   // A7
    ];
    // ボサノバ:明るめの和音を、2小節ずつ
    const PROG_BOSSA=[
      {root:48, v:[64,67,71,74]}, {root:48, v:[64,67,71,74]},   // Cmaj9
      {root:45, v:[64,67,72,76]}, {root:45, v:[64,67,72,76]},   // Am9
      {root:50, v:[65,69,72,76]}, {root:50, v:[65,69,72,76]},   // Dm9
      {root:43, v:[65,69,71,76]}, {root:43, v:[65,68,71,75]},   // G13 → G7(b13)
    ];
    // ローファイ:ゆったりした4つの和音のくり返し
    const PROG_LOFI=[
      {root:41, v:[64,67,69,72]},   // Fmaj7
      {root:40, v:[62,67,71,74]},   // Em7
      {root:38, v:[65,69,72,76]},   // Dm9
      {root:36, v:[64,67,71,74]},   // Cmaj9
    ];
    // 夜のピアノ:静かな分散和音
    const PROG_PIANO=[
      {root:45, v:[57,64,67,72]},   // Am7
      {root:41, v:[57,64,65,69]},   // Fmaj7
      {root:48, v:[55,64,67,71]},   // Cmaj7
      {root:43, v:[55,62,67,71]},   // G
    ];
    const STYLES={
      jazz: {bpm:68, swing:0.64, prog:PROG_JAZZ},
      bossa:{bpm:132, swing:0.5, prog:PROG_BOSSA},
      lofi: {bpm:74, swing:0.58, prog:PROG_LOFI},
      piano:{bpm:58, swing:0.55, prog:PROG_PIANO},
    };
    function applyStyle(name){
      const st=STYLES[name]||STYLES.jazz; style=STYLES[name]?name:'jazz';
      BPM=st.bpm; beat=60/BPM; swing=st.swing; PROG=st.prog; step=0;
    }
    applyStyle('jazz');
    function setup(){
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0;
      const warm = ctx.createBiquadFilter(); warm.type='lowpass'; warm.frequency.value=3200;
      // 小さな部屋の響き(短いディレイを2本)
      verb = ctx.createGain(); verb.gain.value=0.22;
      const d1=ctx.createDelay(), d2=ctx.createDelay(), f1=ctx.createGain(), f2=ctx.createGain();
      d1.delayTime.value=0.071; d2.delayTime.value=0.113; f1.gain.value=0.35; f2.gain.value=0.3;
      verb.connect(d1); verb.connect(d2); d1.connect(f1); f1.connect(d2); d2.connect(f2); f2.connect(d1);
      d1.connect(warm); d2.connect(warm);

      noiseBuf = ctx.createBuffer(1, ctx.sampleRate*0.5, ctx.sampleRate);
      const ch=noiseBuf.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
      return true;
    }
    function out(node, wet){ node.connect(master); if(wet) { const g=ctx.createGain(); g.gain.value=wet; node.connect(g); g.connect(verb); } }
    // エレピ(ローズ風):サイン波+軽いベルの倍音+ゆるいトレモロ
    function ep(m, t, vol, len){

      bg.gain.setValueAtTime(vol*0.35,t); bg.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(vol*0.5,t+0.4); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      const trem=ctx.createOscillator(), tg=ctx.createGain(); trem.frequency.value=4.2; tg.gain.value=vol*0.18; trem.connect(tg); tg.connect(g.gain);

    function bass(m, t, len){

      o.type='triangle'; o.frequency.value=mtof(m); lp.type='lowpass'; lp.frequency.value=700;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.02); g.gain.exponentialRampToValueAtTime(0.12,t+0.18); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      o.connect(lp); lp.connect(g); out(g, .2); o.start(t); o.stop(t+len+0.05);
    }
    // ブラシ(スネアをなでる音)
    function brush(t, vol, len){

      s.buffer=noiseBuf; bp.type='bandpass'; bp.frequency.value=5200; bp.Q.value=0.7;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      s.connect(bp); bp.connect(g); out(g, .15); s.start(t); s.stop(t+len+0.05);
    }
    // ローファイ用:やわらかいキック
    function kick(t, vol){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(45,t+0.18);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g); out(g, 0); o.start(t); o.stop(t+0.4);
    }
    // レコードのプチプチ音
    function crackle(t){
      const s=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), g=ctx.createGain();
      s.buffer=noiseBuf; hp.type='highpass'; hp.frequency.value=3000;
      g.gain.setValueAtTime(0.012+Math.random()*0.01,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.02);
      s.connect(hp); hp.connect(g); out(g,0); s.start(t, Math.random()*0.4); s.stop(t+0.03);
    }
    // ビブラフォン風の単音
    function vib(m, t){
      const o=ctx.createOscillator(), g=ctx.createGain(), trem=ctx.createOscillator(), tg=ctx.createGain();
      o.type='sine'; o.frequency.value=mtof(m); trem.frequency.value=5.5; tg.gain.value=0.02; trem.connect(tg); tg.connect(g.gain);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.07,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
      o.connect(g); out(g, 1.2); [o,trem].forEach(n=>{ n.start(t); n.stop(t+1.7); });
    }
    function schedule(){
      while(nextTime < ctx.currentTime + 0.5){
        const bar=Math.floor(step/8)%PROG.length, eighth=step%8, beatNo=Math.floor(eighth/2), off=eighth%2===1;
        const ch=PROG[bar], nx=PROG[(bar+1)%PROG.length];
        const t = nextTime + (off ? beat*(swing-0.5) : 0);
        if(style!=='jazz'){ playStyle(ch, nx, eighth, beatNo, off, t); nextTime += beat/2; step++; continue; }
        // ベース:4分音符で歩く(ルート→5度→3度→次の和音への半音)
        if(!off){
          const walk=[ch.root, ch.root+7, ch.root+(Math.random()<.5?3:4), nx.root+(Math.random()<.5?-1:1)];
          bass(walk[beatNo], t, beat*0.95);
        }
        // エレピ:1拍目と、2拍目の裏で和音(たまに休む)
        if(eighth===0 && Math.random()<.9) ch.v.forEach((m,k)=>ep(m, t+k*0.012, 0.045, beat*2.4));
        if(eighth===3 && Math.random()<.5) ch.v.forEach((m,k)=>ep(m, t+k*0.01, 0.03, beat*1.2));
        // ブラシ:2拍目と4拍目を少し強く、ハネた裏拍を軽く
        if(!off) brush(t, (beatNo%2===1)?0.05:0.022, 0.22); else if(Math.random()<.6) brush(t, 0.016, 0.12);
        // ときどきビブラフォンが和音の音をひとつ鳴らす
        if(Math.random()<0.12) vib(ch.v[Math.floor(Math.random()*4)]+12, t);
        nextTime += beat/2; step++;
      }
    }
    function playStyle(ch, nx, eighth, beatNo, off, t){
      if(style==='bossa'){
        // ベース:1拍目にルート、2拍目の裏に5度(ボサノバの定番の動き)
        if(eighth===0||eighth===4) bass(ch.root, t, beat*0.9);
        if(eighth===3||eighth===7) bass(ch.root+7, t, beat*0.6);
        // ギター代わりのエレピ:シンコペーションで刻む
        if([0,3,6].includes(eighth) && (step/8|0)%2===0) ch.v.forEach((m,k)=>ep(m, t+k*0.006, 0.026, beat*0.7));
        if([2,5].includes(eighth) && (step/8|0)%2===1) ch.v.forEach((m,k)=>ep(m, t+k*0.006, 0.024, beat*0.7));
        // ブラシ:8分で軽く
        brush(t, eighth%2===0?0.02:0.012, 0.1);
        if(Math.random()<0.06) vib(ch.v[Math.floor(Math.random()*4)]+12, t);
      } else if(style==='lofi'){
        if(eighth===0) ch.v.forEach((m,k)=>ep(m-12, t+k*0.02, 0.04, beat*3.6));
        if(eighth===5 && Math.random()<.6) ch.v.forEach((m,k)=>ep(m, t+k*0.015, 0.022, beat*1.5));
        if(eighth===0||eighth===4) bass(ch.root+12, t, beat*1.4);
        if(eighth===0||eighth===5) kick(t, 0.35);
        if(eighth===2||eighth===6) brush(t, 0.06, 0.18);
        if(Math.random()<0.5) crackle(t+Math.random()*beat*0.5);
      } else if(style==='piano'){
        // 和音の音を、ひとつずつゆっくり鳴らす
        const order=[0,1,2,3,2,1,3,2], m=ch.v[order[eighth]];
        if(eighth===0) bass(ch.root-12, t, beat*3.8);
        if(Math.random()<0.85) ep(m+12, t, 0.05, beat*2.2);
        if(eighth===0 && Math.random()<0.5) vib(ch.v[3]+24, t+beat*2);
      }
    }
    return {
      setStyle(name){ applyStyle(name); if(ctx && timer){ nextTime = ctx.currentTime + 0.2; } },
      start(){ if(!ctx && !setup()) return; ctx.resume(); master.gain.setTargetAtTime(0.42, ctx.currentTime, 0.6);
        if(!timer){ nextTime = ctx.currentTime + 0.15; timer = setInterval(schedule, 120); } },
      // iPhone:タッチの中で無音を1回鳴らすと音が出せるようになる
      unlock(){ if(!ctx) return; if(ctx.state!=='running') ctx.resume();
        try{ const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); }catch(_){} },
      running(){ return !!ctx && ctx.state==='running'; },
      stop(){ if(!ctx) return; master.gain.setTargetAtTime(0.0, ctx.currentTime, 0.15);
        clearInterval(timer); timer=null; setTimeout(()=>{ if(!timer) ctx.suspend(); }, 600); }
    };
  })();
  let musicOn = true; try{ musicOn = localStorage.getItem('ejigsaw-music') !== 'off'; }catch(_){}
  const muteBtn = document.getElementById('muteBtn');
  function setMusic(on){
    musicOn = on; muteBtn.innerHTML = on ? ICON_SOUND_ON : ICON_SOUND_OFF;
    try{ localStorage.setItem('ejigsaw-music', on ? 'on' : 'off'); }catch(_){}
    if(on && started) bgm.start(); else bgm.stop();
  }
  // iPhoneでは、音は画面にさわってからでないと鳴らせないので、最初のタッチで鳴らし始める
  let started=false;
  // iPhone:マナーモードでもBGMを鳴らす(対応している iOS のみ)
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(_){}
  window.addEventListener('pointerdown', () => { if(started) return; started=true; if(musicOn) bgm.start(); }, {capture:true});
  // iPhoneは指を離したとき(touchend/click)でないと音を許可しないことがあるので、鳴るまで毎回解除を試す
  const tryUnlock = () => { if(!musicOn) return; if(!started){ started=true; bgm.start(); } if(!bgm.running()) bgm.unlock(); };
  ['touchend','click','pointerup'].forEach(ev => window.addEventListener(ev, tryUnlock, {capture:true, passive:true}));
  muteBtn.addEventListener('click', () => setMusic(!musicOn));
  document.addEventListener('visibilitychange', () => { if(document.hidden) bgm.stop(); else if(musicOn && started) bgm.start(); });
  // 選んでいたBGM(解放済みのものだけ)
  let bgmChoice='jazz'; try{ bgmChoice=localStorage.getItem('ejigsaw-bgm')||'jazz'; }catch(_){}
  if(!BGM_TRACKS.some(tr=>tr.id===bgmChoice && clears>=tr.need)) bgmChoice='jazz';
  bgm.setStyle(bgmChoice);
  setMusic(musicOn);

  /* ---------- テーマ切替(美術館/ポップ)。選んだテーマはこの端末に覚えておく ---------- */
  // 没入テーマ(glass)はシンプルの配置をもとに、色とボタンの質感を変える
  const muteHome=document.getElementById('muteBtn').parentNode;
  function setTheme(th){
    if(!['glass','simple','museum'].includes(th)) th='glass';
    const glass = th==='glass';
    document.documentElement.dataset.theme = glass ? 'simple' : th;
    document.documentElement.classList.toggle('glass', glass);
    // 没入では音のボタンを上の段(設定の左)へ
    const mute=document.getElementById('muteBtn'), gear=document.getElementById('gearBtn');
    if(glass) gear.parentNode.insertBefore(mute, gear); else muteHome.insertBefore(mute, muteHome.firstChild);
    document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeBtn===th)));
    pieceR = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--piece-r')) || 3;
    try{ localStorage.setItem('ejigsaw-theme-v2', th); }catch(_){}
    if(els.length){ measure(); render(); }
  }
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));
  // 没入テーマを新しい標準にする(以前の保存値は使わず、v2のキーで覚える)
  let savedTheme='glass';
  setTheme(savedTheme);

  /* ---------- 画面サイズ変更 ---------- */
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ measure(); render(); },120); });

  loadStages().catch(()=>{}).then(()=>{
    // 前回遊んでいた絵から再開する
    let first=0; try{ const last=localStorage.getItem('ejigsaw-last'); const k=MASTER.findIndex(m=>m.id===last); if(k>=0) first=k; }catch(_){}
    startStage(first);
    showHome();
  });
})();
</script>
